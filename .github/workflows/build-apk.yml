name: Build BINGOP2E APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack starter if ZIP exists
        run: |
          if [ -f BINGOP2E_Android_Starter.zip ]; then
            unzip -q BINGOP2E_Android_Starter.zip
            rm -f BINGOP2E_Android_Starter.zip
          fi
          ls -la

      - name: Find gradlew and fix JVM
        run: |
          GRADLEW=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "No gradlew found!"
            exit 1
          fi
          DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "Found at $GRADLEW in $DIR"
          chmod +x "$GRADLEW"
          FILE="$DIR/app/build.gradle.kts"
          [ -f "$FILE" ] || FILE="app/build.gradle.kts"
          sed -i 's/VERSION_1_8/VERSION_17/g' "$FILE" || true
          sed -i 's/VERSION_11/VERSION_17/g' "$FILE" || true
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$FILE" || true
          sed -i 's/jvmTarget = "11"/jvmTarget = "17"/g' "$FILE" || true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          cd $PROJECT_DIR
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BINGOP2E-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
