name: Build BINGOP2E APK - FINAL SIMPLE

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix JVM Target to 17
        run: |
          FILE="BINGOP2E_Android_Starter/app/build.gradle.kts"
          [ -f "$FILE" ] || FILE="app/build.gradle.kts"
          sed -i 's/VERSION_1_8/VERSION_17/g' "$FILE" || true
          sed -i 's/VERSION_11/VERSION_17/g' "$FILE" || true
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$FILE" || true

      - name: Build APK
        run: |
          chmod +x BINGOP2E_Android_Starter/gradlew 2>/dev/null || true
          chmod +x gradlew 2>/dev/null || true
          if [ -f "BINGOP2E_Android_Starter/gradlew" ]; then
            cd BINGOP2E_Android_Starter && ./gradlew assembleDebug --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BINGOP2E-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
