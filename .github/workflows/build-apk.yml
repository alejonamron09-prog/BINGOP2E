name: Build BINGOP2E APK - FIXED

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack starter if ZIP exists
        run: |
          if [ -f BINGOP2E_Android_Starter.zip ]; then
            unzip -q BINGOP2E_Android_Starter.zip
            echo "PROJECT_DIR=BINGOP2E_Android_Starter" >> $GITHUB_ENV
          else
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          fi
          ls -la $PROJECT_DIR/app/ || true

      - name: Fix JVM Target - Force Java 17
        run: |
          FILE="${{ env.PROJECT_DIR }}/app/build.gradle.kts"
          if [ -f "$FILE" ]; then
            sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$FILE"
            sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$FILE"
            sed -i 's/"1.8"/"17"/g' "$FILE"
            # Ensure kotlinOptions exists
            if ! grep -q "jvmTarget" "$FILE"; then
              echo 'android { kotlinOptions { jvmTarget = "17" } }' >> "$FILE"
            fi
            echo "Fixed gradle file:"
            grep -n "VERSION\|jvmTarget" "$FILE" || true
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          chmod +x $PROJECT_DIR/gradlew 2>/dev/null || true
          $PROJECT_DIR/gradlew -p $PROJECT_DIR assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BINGOP2E-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
